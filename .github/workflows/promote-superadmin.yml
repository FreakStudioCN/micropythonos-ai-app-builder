name: promote-erkou2222-production-superadmin

on:
  workflow_dispatch:

permissions: {}

jobs:
  promote:
    name: promote existing production account
    runs-on: upypi
    timeout-minutes: 5
    environment: production
    concurrency:
      group: promote-erkou2222-production-superadmin
      cancel-in-progress: false
    env:
      STACK_DIR: ${{ vars.MPOS_STACK_DIR || '/srv/upypi' }}
      TARGET_USERNAME: erkou2222
    steps:
      - name: Promote account without resetting its password
        shell: bash
        run: |
          set -euo pipefail

          cd "${STACK_DIR}"
          container=$(docker compose ps -q mpos-app | head -n 1)
          if [ -z "${container}" ]; then
            echo "mpos-app is not running" >&2
            exit 1
          fi

          docker exec \
            -e PYTHONPATH=/app/backend \
            -e TARGET_USERNAME="${TARGET_USERNAME}" \
            "${container}" \
            python -c 'import os; from app.auth import ROLE_SUPERADMIN, auth_service; user = auth_service.provision_superadmin(os.environ["TARGET_USERNAME"], None, promote_existing=True); assert user["role"] == ROLE_SUPERADMIN; print("promoted={} role={}".format(user["username"], user["role"]))'
