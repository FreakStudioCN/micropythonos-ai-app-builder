name: publish-image

# Build the production image and push it to GHCR; deploy it on the self-hosted
# production runner. Modeled on cursor_for_hardware's publish-image.yml, hardened:
#
#   - deploy is gated on CI: the main-branch path triggers via `workflow_run` on a
#     SUCCESSFUL CI run and builds exactly `workflow_run.head_sha` (source_sha) —
#     a plain checkout here would silently build the current main HEAD, which may
#     be a newer, untested commit.
#   - `workflow_dispatch` is restricted to main and verifies that CI succeeded for
#     the resolved sha before building.
#   - push to deploy/domestic and v* tags: image build + smoke only, NO deploy.
#   - the deploy job updates the MPOS_IMAGE line in the shared stack's .env
#     transactionally (restores the previous pin and stack on failure) and audits
#     `source_sha` + digest in the job summary. The stack directory is the one
#     that already holds the plugin backend's compose.yml — set the repository
#     variable MPOS_STACK_DIR to its path; the job refuses to run without it.
#
# SHARED STACK: mpos-app lives in the SAME compose file as the plugin backend
# (mpyhw-api), so every docker compose call here is scoped to `mpos-app` and the
# .env rewrite is line-surgical. An unscoped `up -d` would restart the plugin
# backend on every deployment; a whole-file .env write would delete its lines.
# Never add --remove-orphans: it would tear down the neighbouring services.
#
# SECURITY (red line): NEVER add `pull_request` or `pull_request_target` triggers —
# the deploy job runs on a self-hosted runner ON the production host; a PR trigger
# would hand fork code execution on that machine. The self-hosted job must never
# check out the repository or run repository scripts.

on:
  push:
    branches: [deploy/domestic]
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  IMAGE_NAME: ghcr.io/freakstudiocn/micropythonos-ai-app-builder

jobs:
  image:
    name: build + smoke + push image
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read   # workflow_dispatch path queries CI run conclusions
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      source_sha: ${{ steps.src.outputs.sha }}
    steps:
      - name: Resolve source_sha (the commit that passed CI)
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_run)
              # `branches: [main]` filters the TRIGGERING run's head_branch, not a
              # base ref. A fork PR whose head branch is itself named `main`
              # produces a CI run that matches this filter, and building its
              # head_sha would ship fork-authored code to the production host —
              # exactly the hole the `pull_request` ban above exists to close,
              # reached indirectly. Require a push, from this repository, on main.
              test "${{ github.event.workflow_run.event }}" = "push"
              test "${{ github.event.workflow_run.head_repository.full_name }}" = "${{ github.repository }}"
              test "${{ github.event.workflow_run.head_branch }}" = "main"
              sha="${{ github.event.workflow_run.head_sha }}"
              ;;
            workflow_dispatch)
              test "${{ github.ref }}" = "refs/heads/main"
              sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
              conclusion=$(gh api \
                "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=completed&per_page=1" \
                --jq '.workflow_runs[0].conclusion')
              test "${conclusion}" = "success"
              ;;
            *)
              sha="${{ github.sha }}"
              ;;
          esac
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "building source_sha=${sha}" >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.src.outputs.sha }}
          submodules: false

      # The image only needs MicroPython_Skills (vendor/MicroPythonOS is excluded
      # by .dockerignore); skip the huge recursive OS checkout.
      - name: Check out the skills submodule only
        run: git submodule update --init vendor/MicroPython_Skills

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=sha-${{ steps.src.outputs.sha }}
            type=semver,pattern={{version}}
          # On workflow_run GITHUB_SHA is the current main HEAD, not the commit
          # that passed CI — pin the revision label to source_sha explicitly.
          labels: |
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}

      # Same tags/labels as the push build below so the second build is a pure
      # cache hit producing the IDENTICAL image — what we smoke is what we ship.
      - name: Build image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Default env = local sqlite + filesystem sessions: the container must start,
      # serve /api/health, and run as a non-root user.
      - name: Container smoke test (non-root + health)
        run: |
          set -euo pipefail
          docker run -d --name mpos-smoke -p 18080:10000 "${IMAGE_NAME}:sha-${{ steps.src.outputs.sha }}"
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "${ok}" ]; then docker logs mpos-smoke; exit 1; fi
          uid=$(docker exec mpos-smoke id -u)
          echo "container uid=${uid}"
          test "${uid}" != "0"
          curl -fsS http://127.0.0.1:18080/api/health | jq -e '.status == "ok"'
          docker rm -f mpos-smoke

      - name: Push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy on production host
    needs: image
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    # Single label, matching the plugin backend's already-working deploy job on
    # this same runner. The four-element [self-hosted, Linux, X64, upypi] form
    # relies on the default labels actually being present; if the runner was
    # registered without one of them the job sits QUEUED forever and never
    # errors. Labels are routing, not a security boundary — scoping the runner
    # to this repository is what limits it, so the extra labels buy nothing.
    runs-on: upypi
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: none
      packages: read
    steps:
      - name: Pull, pin, deploy (transactional)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          SOURCE_SHA: ${{ needs.image.outputs.source_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # /srv/upypi is where the stack actually lives: the plugin backend's
          # merged deploy job cd's there today. Overridable if the ops owner
          # moves it; a wrong value fails loudly at the cd below, so the default
          # cannot mask a mistake.
          STACK_DIR: ${{ vars.MPOS_STACK_DIR || '/srv/upypi' }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/freakstudiocn/micropythonos-ai-app-builder@${DIGEST}"
          export DOCKER_CONFIG="$(mktemp -d)"
          # ONE exit handler, because a second `trap ... EXIT` would silently
          # replace this one and leave the GHCR credentials on the host. It also
          # carries the pin rollback: a job timeout or a manual cancel kills this
          # shell outright, so the rollback further down would never run and .env
          # would stay pinned to a digest that never came up. Restoring the pin
          # is all it does — a compose call here could be killed mid-flight too;
          # the next deploy or a manual `up -d` then lands on the good digest.
          rollback_armed=""
          cleanup() {
            if [ -n "${rollback_armed}" ]; then
              echo "interrupted before verification — restoring pin: ${OLD_PIN}" >&2
              set_pin "${OLD_PIN}"
            fi
            rm -rf "${DOCKER_CONFIG}"
          }
          trap cleanup EXIT INT TERM
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # GitHub reachability from this host is intermittent — it is why a
          # webhook-driven CD was rejected in favour of this runner. Retry a
          # transient blip rather than failing a deployment over it. Still fails
          # loudly once the attempts are spent; this is a retry, not a fallback.
          pulled=""
          for attempt in 1 2 3; do
            if docker pull "${IMAGE}"; then pulled=1; break; fi
            echo "pull attempt ${attempt}/3 failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          if [ -z "${pulled}" ]; then
            echo "docker pull failed after 3 attempts — GHCR unreachable or digest missing" >&2
            exit 1
          fi
          cd "${STACK_DIR}"

          # This .env is shared with the plugin backend's stack. Only the
          # MPOS_IMAGE line changes; every other line is carried through
          # verbatim. The write itself is a whole-file rewrite, not a one-line
          # patch — see set_pin for why it is done in place.
          OLD_PIN=$(sed -n 's/^MPOS_IMAGE=//p' .env)
          if [ -z "${OLD_PIN}" ]; then
            echo "no MPOS_IMAGE line in ${STACK_DIR}/.env — the first deployment is" >&2
            echo "manual and seeds it (see the launch sequence in the plan doc)." >&2
            exit 1
          fi
          # In place rather than temp-file + mv: this .env belongs to the shared
          # stack and may be owned by another account, and a recreate would take
          # its owner and mode with it. The cost is that the write is not atomic
          # — accepted, because the alternative can fail every deploy outright.
          # The substitution is captured in full first, so a sed failure aborts
          # under set -e before .env is opened for writing.
          set_pin() {
            new=$(sed "s|^MPOS_IMAGE=.*|MPOS_IMAGE=$1|" .env)
            printf '%s\n' "${new}" > .env
          }

          rollback_armed=1
          set_pin "${IMAGE}"
          deploy_ok=""
          # Scoped to mpos-app (compose still starts its depends_on) so a mpos
          # deployment never restarts the plugin backend in the same file.
          if docker compose up -d --wait mpos-app; then
            # Assignment inside the condition so an inspect failure counts as a
            # failed verification instead of killing the shell under set -e.
            # head -1 because `ps -q` returns newline-separated IDs: a leftover
            # container for this service would make the substitution one quoted
            # multi-line argument, docker inspect would reject it, and a healthy
            # deployment would roll itself back on every run until someone
            # removed the orphan by hand.
            if RUNNING=$(docker inspect "$(docker compose ps -q mpos-app | head -1)" --format '{{.Config.Image}}') \
               && [ "${RUNNING}" = "${IMAGE}" ]; then
              deploy_ok=1
            fi
          fi
          if [ -z "${deploy_ok}" ]; then
            echo "deploy or digest verification failed — rolling back to previous pin: ${OLD_PIN}"
            # Disarm first: this branch does the full rollback (pin AND stack),
            # so the exit handler must not repeat the pin write on the way out.
            rollback_armed=""
            set_pin "${OLD_PIN}"
            docker compose up -d --wait mpos-app
            exit 1
          fi
          rollback_armed=""
          echo "deployed source_sha=${SOURCE_SHA} digest=${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
