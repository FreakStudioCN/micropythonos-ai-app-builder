name: publish-image

# Build the production image and push it to GHCR; deploy it on the self-hosted
# production runner. Modeled on cursor_for_hardware's publish-image.yml, hardened:
#
#   - deploy is gated on CI: the main-branch path triggers via `workflow_run` on a
#     SUCCESSFUL CI run and builds exactly `workflow_run.head_sha` (source_sha) —
#     a plain checkout here would silently build the current main HEAD, which may
#     be a newer, untested commit.
#   - `workflow_dispatch` is restricted to main and verifies that CI succeeded for
#     the resolved sha before building.
#   - push to deploy/domestic and v* tags: image build + smoke only, NO deploy.
#   - the deploy job receives the smoke-tested image through an integrity-checked
#     Actions artifact, retags it to :latest, restarts only mpos-app, and verifies
#     by image ID that the running container is this build. GHCR still stores the
#     immutable image; the artifact avoids the production host's unreliable GHCR
#     layer downloads. The stack directory is the one that already holds the
#     plugin backend's compose.yml — set MPOS_STACK_DIR if it ever moves.
#
# SHARED STACK: mpos-app lives in the SAME compose file as the plugin backend
# (mpyhw-api), so every docker compose call here is scoped to `mpos-app`. An
# unscoped `up -d` would restart the plugin backend on every deployment.
# Never add --remove-orphans: it would tear down the neighbouring services.
#
# SECURITY (red line): NEVER add `pull_request` or `pull_request_target` triggers —
# the deploy job runs on a self-hosted runner ON the production host; a PR trigger
# would hand fork code execution on that machine. The self-hosted job must never
# check out the repository or run repository scripts.

on:
  push:
    branches: [deploy/domestic]
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  IMAGE_NAME: ghcr.io/freakstudiocn/micropythonos-ai-app-builder

jobs:
  image:
    name: build + smoke + push image
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read   # workflow_dispatch path queries CI run conclusions
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      source_sha: ${{ steps.src.outputs.sha }}
    steps:
      - name: Resolve source_sha (the commit that passed CI)
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_run)
              # `branches: [main]` filters the TRIGGERING run's head_branch, not a
              # base ref. A fork PR whose head branch is itself named `main`
              # produces a CI run that matches this filter, and building its
              # head_sha would ship fork-authored code to the production host —
              # exactly the hole the `pull_request` ban above exists to close,
              # reached indirectly. Require a push, from this repository, on main.
              test "${{ github.event.workflow_run.event }}" = "push"
              test "${{ github.event.workflow_run.head_repository.full_name }}" = "${{ github.repository }}"
              test "${{ github.event.workflow_run.head_branch }}" = "main"
              sha="${{ github.event.workflow_run.head_sha }}"
              ;;
            workflow_dispatch)
              test "${{ github.ref }}" = "refs/heads/main"
              sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
              conclusion=$(gh api \
                "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=completed&per_page=1" \
                --jq '.workflow_runs[0].conclusion')
              test "${conclusion}" = "success"
              ;;
            *)
              sha="${{ github.sha }}"
              ;;
          esac
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "building source_sha=${sha}" >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.src.outputs.sha }}
          submodules: false

      # The image only needs MicroPython_Skills (vendor/MicroPythonOS is excluded
      # by .dockerignore); skip the huge recursive OS checkout.
      - name: Check out the skills submodule only
        run: git submodule update --init vendor/MicroPython_Skills

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=sha-${{ steps.src.outputs.sha }}
            type=semver,pattern={{version}}
          # On workflow_run GITHUB_SHA is the current main HEAD, not the commit
          # that passed CI — pin the revision label to source_sha explicitly.
          labels: |
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}

      # Same tags/labels as the push build below so the second build is a pure
      # cache hit producing the IDENTICAL image — what we smoke is what we ship.
      - name: Build image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Default env = local sqlite + filesystem sessions: the container must start,
      # serve /api/health, and run as a non-root user.
      - name: Container smoke test (non-root + health)
        run: |
          set -euo pipefail
          docker run -d --name mpos-smoke -p 18080:10000 "${IMAGE_NAME}:sha-${{ steps.src.outputs.sha }}"
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "${ok}" ]; then docker logs mpos-smoke; exit 1; fi
          uid=$(docker exec mpos-smoke id -u)
          echo "container uid=${uid}"
          test "${uid}" != "0"
          curl -fsS http://127.0.0.1:18080/api/health | jq -e '.status == "ok"'
          docker rm -f mpos-smoke

      - name: Push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The production host has repeatedly downloaded every GHCR layer and then
      # hung before Docker committed the image. Retrying `docker pull` therefore
      # cannot make deployment reliable. Export the exact image that passed the
      # smoke test and transfer it through the Actions artifact service instead.
      # GHCR remains the immutable registry/archive; the artifact is only the
      # transport used by the self-hosted production runner.
      - name: Export production image bundle
        run: |
          set -euo pipefail
          docker save "${IMAGE_NAME}:sha-${{ steps.src.outputs.sha }}" \
            | gzip -1 > mpos-production-image.tar.gz
          sha256sum mpos-production-image.tar.gz > mpos-production-image.tar.gz.sha256
          ls -lh mpos-production-image.tar.gz mpos-production-image.tar.gz.sha256

      - name: Upload production image bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mpos-production-image-${{ steps.src.outputs.sha }}
          path: |
            mpos-production-image.tar.gz
            mpos-production-image.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    name: deploy on production host
    needs: image
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    # Single label, matching the plugin backend's already-working deploy job on
    # this same runner. The four-element [self-hosted, Linux, X64, upypi] form
    # relies on the default labels actually being present; if the runner was
    # registered without one of them the job sits QUEUED forever and never
    # errors. Labels are routing, not a security boundary — scoping the runner
    # to this repository is what limits it, so the extra labels buy nothing.
    runs-on: upypi
    # The production runner's connection to the Actions artifact service can
    # take roughly 35 minutes for a 100+ MB image bundle. Leave enough time for
    # the completed download, image load, transactional switch and health check.
    timeout-minutes: 75
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: none
      actions: read
      packages: read
    steps:
      - name: Download production image bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mpos-production-image-${{ needs.image.outputs.source_sha }}
          path: ${{ runner.temp }}/mpos-production-image

      - name: Load, pin, deploy (transactional)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          SOURCE_SHA: ${{ needs.image.outputs.source_sha }}
          PRODUCTION_KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          PRODUCTION_ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          IMAGE_BUNDLE_DIR: ${{ runner.temp }}/mpos-production-image
          # /srv/upypi is where the stack actually lives: the plugin backend's
          # merged deploy job cd's there today. Overridable if the ops owner
          # moves it; a wrong value fails loudly at the cd below, so the default
          # cannot mask a mistake.
          STACK_DIR: ${{ vars.MPOS_STACK_DIR || '/srv/upypi' }}
        run: |
          set -euo pipefail
          bundle="${IMAGE_BUNDLE_DIR}/mpos-production-image.tar.gz"
          checksum="${bundle}.sha256"
          test -s "${bundle}"
          test -s "${checksum}"
          cd "${IMAGE_BUNDLE_DIR}"
          sha256sum -c "$(basename "${checksum}")"
          timeout 420 sh -c 'gzip -dc "$1" | docker load' sh "${bundle}"

          # docker save/load preserves the immutable source-SHA tag. Retag that
          # locally to the handle used by compose; no registry access occurs on
          # the production host.
          SOURCE_IMAGE="${IMAGE_NAME}:sha-${SOURCE_SHA}"
          docker image inspect "${SOURCE_IMAGE}" >/dev/null
          docker tag "${SOURCE_IMAGE}" "${IMAGE_NAME}:latest"

          # Resolve the image ID now, for verification after the restart. The
          # container reports the ID it was created from, not the tag, so this
          # is what proves the running container is THIS build and not whatever
          # :latest happened to point at before.
          WANT_ID=$(docker inspect --format '{{.Id}}' "${SOURCE_IMAGE}")

          cd "${STACK_DIR}"

          # AI provider credentials are runtime configuration, never image
          # contents. Store them in a dedicated mode-0600 env file and register
          # a persistent compose override so later compose operations do not
          # recreate mpos-app without GLM/Kimi access.
          if [ -z "${PRODUCTION_KIMI_API_KEY}" ] || [ -z "${PRODUCTION_ZHIPU_API_KEY}" ]; then
            echo "production KIMI_API_KEY and ZHIPU_API_KEY secrets are required" >&2
            exit 1
          fi
          umask 077
          provider_env_tmp=$(mktemp "${STACK_DIR}/.mpos-ai-providers.env.XXXXXX")
          {
            printf 'KIMI_API_KEY=%s\n' "${PRODUCTION_KIMI_API_KEY}"
            printf 'ZHIPU_API_KEY=%s\n' "${PRODUCTION_ZHIPU_API_KEY}"
          } > "${provider_env_tmp}"
          chmod 600 "${provider_env_tmp}"
          mv "${provider_env_tmp}" .mpos-ai-providers.env

          provider_override=compose.mpos-ai-providers.yml
          override_tmp=$(mktemp "${STACK_DIR}/${provider_override}.XXXXXX")
          cat > "${override_tmp}" <<'YAML'
          services:
            mpos-app:
              env_file:
                - ./.mpos-ai-providers.env
              # Read timeouts allow slow healthy streams, while wall timeouts
              # prevent reasoning/heartbeat streams from blocking failover.
              environment:
                AI_STREAM_RESPONSES: "true"
                AI_OVERALL_TIMEOUT_SECONDS: "480"
                AI_READ_TIMEOUT_SECONDS: "600"
                ZHIPU_READ_TIMEOUT_SECONDS: "600"
                KIMI_READ_TIMEOUT_SECONDS: "600"
                DEEPSEEK_READ_TIMEOUT_SECONDS: "300"
                AI_PROVIDER_WALL_TIMEOUT_SECONDS: "180"
                ZHIPU_WALL_TIMEOUT_SECONDS: "210"
                KIMI_WALL_TIMEOUT_SECONDS: "180"
                DEEPSEEK_WALL_TIMEOUT_SECONDS: "90"
                DEEPSEEK_MAX_ATTEMPTS: "3"
                AI_QUALITY_ATTEMPTS_PER_PROVIDER: "2"
                AI_PROVIDER_ORDER_SIMPLE: "kimi,zhipu_glm52,deepseek"
                AI_PROVIDER_ORDER_STANDARD: "zhipu_glm52,kimi,deepseek"
                AI_PROVIDER_ORDER_COMPLEX: "zhipu_glm52,kimi,deepseek"
                AI_PROVIDER_ORDER_REVISION: "zhipu_glm52,kimi,deepseek"
                AI_PROVIDER_ORDER_REPAIR: "zhipu_glm52,kimi,deepseek"
                DEEPSEEK_GENERATION_BUDGET_SECONDS: "480"
                DEEPSEEK_REQUEST_TIMEOUT_SECONDS: "600"
          YAML
          chmod 600 "${override_tmp}"
          mv "${override_tmp}" "${provider_override}"

          existing_compose_file=""
          if [ -f .env ]; then
            existing_compose_file=$(sed -n 's/^COMPOSE_FILE=//p' .env | tail -1)
          fi
          if [ -z "${existing_compose_file}" ]; then
            base_compose=""
            for candidate in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
              if [ -f "${candidate}" ]; then base_compose="${candidate}"; break; fi
            done
            if [ -z "${base_compose}" ]; then
              echo "no compose file found in ${STACK_DIR}" >&2
              exit 1
            fi
            existing_compose_file="${base_compose}"
          fi
          case ":${existing_compose_file}:" in
            *":${provider_override}:"*) compose_files="${existing_compose_file}" ;;
            *) compose_files="${existing_compose_file}:${provider_override}" ;;
          esac
          stack_env_tmp=$(mktemp "${STACK_DIR}/.env.XXXXXX")
          if [ -f .env ]; then grep -v '^COMPOSE_FILE=' .env > "${stack_env_tmp}" || true; fi
          printf 'COMPOSE_FILE=%s\n' "${compose_files}" >> "${stack_env_tmp}"
          chmod 600 "${stack_env_tmp}"
          mv "${stack_env_tmp}" .env
          export COMPOSE_FILE="${compose_files}"

          deploy_ok=""
          # Scoped to mpos-app (compose still starts its depends_on) so a mpos
          # deployment never restarts the plugin backend in the same file.
          #
          # This is bounded because on a first deployment `up` may pull postgres,
          # minio and mc from a mirror and can hang on a registry layer. `--wait`
          # then blocks on health with no bound of its own. 420s covers the real
          # startup cost — mpos-db needs up to 100s of pg_isready retries and
          # mpos-app has a 60s start_period.
          if timeout 420 docker compose up -d --wait mpos-app; then
            # Assignment inside the condition so an inspect failure counts as a
            # failed verification instead of killing the shell under set -e.
            # head -1 because `ps -q` returns newline-separated IDs: a leftover
            # container for this service would make the substitution one quoted
            # multi-line argument and docker inspect would reject it.
            #
            # Compare image IDs, not `.Config.Image`: with a mutable tag that
            # field just reads back "…:latest" and would match no matter which
            # build is actually running, i.e. a check that can never fail.
            RUNNING_CONTAINER=$(docker compose ps -q mpos-app | head -1)
            if RUNNING_ID=$(docker inspect "${RUNNING_CONTAINER}" --format '{{.Image}}') \
               && [ "${RUNNING_ID}" = "${WANT_ID}" ] \
               && docker exec "${RUNNING_CONTAINER}" sh -c \
                    'test -n "$KIMI_API_KEY" && test -n "$ZHIPU_API_KEY" && \
                     test "$AI_STREAM_RESPONSES" = "true" && \
                     test "$AI_OVERALL_TIMEOUT_SECONDS" = "480" && \
                     test "$AI_READ_TIMEOUT_SECONDS" = "600" && \
                     test "$ZHIPU_READ_TIMEOUT_SECONDS" = "600" && \
                     test "$KIMI_READ_TIMEOUT_SECONDS" = "600" && \
                     test "$ZHIPU_WALL_TIMEOUT_SECONDS" = "210" && \
                     test "$KIMI_WALL_TIMEOUT_SECONDS" = "180"'; then
              deploy_ok=1
            fi
          fi
          if [ -z "${deploy_ok}" ]; then
            echo "deploy failed, or the running container is not this build" >&2
            echo "  wanted image id: ${WANT_ID}" >&2
            echo "  running now    : ${RUNNING_ID:-<none>}" >&2
            # No automatic rollback: with a tag-based deployment there is no
            # previous pin recorded anywhere to roll back TO. Recovery is
            # `docker tag <previous digest> :latest && docker compose up -d
            # --wait mpos-app` on the host. This is the cost that was accepted
            # when the .env pin was dropped, and it is stated rather than
            # silently absent.
            exit 1
          fi
          echo "deployed source_sha=${SOURCE_SHA} digest=${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          echo "GLM/Kimi provider credentials: present in running container" >> "${GITHUB_STEP_SUMMARY}"
          echo "AI streaming and 600-second idle-read windows: verified" >> "${GITHUB_STEP_SUMMARY}"
