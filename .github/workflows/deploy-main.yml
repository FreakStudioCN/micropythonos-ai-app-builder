name: Deploy main to Render

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-d9i5u93h2c0s7387rtn0
      PRODUCTION_URL: https://blockless-make-app.onrender.com
      DEPLOY_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Point service at main
        run: |
          response=$(curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"branch":"main","autoDeploy":"yes"}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}")
          test "$(jq -r '.branch' <<<"${response}")" = "main"

      - name: Trigger deploy
        id: trigger
        run: |
          payload=$(jq -nc --arg commit "${DEPLOY_COMMIT}" '{commitId:$commit,clearCache:"do_not_clear"}')
          response=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          deploy_id=$(jq -r '.id // .deploy.id // empty' <<<"${response}")
          test -n "${deploy_id}"
          echo "deploy_id=${deploy_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for live deployment
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          for attempt in $(seq 1 72); do
            response=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")
            status=$(jq -r '.status // .deploy.status // "unknown"' <<<"${response}")
            echo "Render deploy ${DEPLOY_ID}: ${status}"
            case "${status}" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          exit 1

      - name: Verify production health
        run: |
          health=$(curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${PRODUCTION_URL}/api/health")
          jq -e '.status == "ok" and .database_backend == "postgresql" and .object_storage_enabled == true' <<<"${health}"
