services:
  - type: web
    name: blockless-make-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: MPOS_COOKIE_SECURE
        value: "true"
      - key: MPOS_COOKIE_SAMESITE
        value: lax
      - key: MPOS_DEMO_ERROR_INJECTION
        value: "false"
      - key: MPOS_REQUIRE_DURABLE_STORAGE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MPOS_STORAGE_ENDPOINT
        sync: false
      - key: MPOS_STORAGE_REGION
        sync: false
      - key: MPOS_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: MPOS_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: MPOS_STORAGE_SESSION_TOKEN
        sync: false
      - key: MPOS_STORAGE_BUCKET
        value: mpos-sessions
