# MicroPythonOS AI App Builder — the services to ADD to the production host's
# EXISTING compose stack (the one that already runs the plugin backend
# `mpyhw-api` behind Caddy). This is a PASTE SOURCE, not a runnable file.
#
# ┌─ READ THIS FIRST ────────────────────────────────────────────────────────┐
# │ Do NOT copy this file to the server as `compose.yml`. It has no project  │
# │ `name:` and no `edge:` network on purpose — both already exist in the    │
# │ host's file. Copying it over would orphan the running plugin backend.    │
# │                                                                          │
# │ The host keeps ONE compose file and ONE `docker compose up`. Paste the   │
# │ four services below into its `services:` map, and the network + volumes  │
# │ into its `networks:` / `volumes:` maps.                                  │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Every name here is `mpos`-prefixed because the host file already defines
# `db`, `pgdata` and `internal` for the plugin backend. Those three would
# collide silently on paste — a duplicate YAML key does not error, it wins.
# Do not "simplify" the prefixes back out.
#
# Caddy runs INSIDE this stack (a `caddy` service publishing :80/:443 and
# mounting ./Caddyfile), not as an external proxy on a shared network. The host
# file declares no networks at all, so every service sits on compose's implicit
# `default` network and Caddy resolves them by service name.
#
# That is why mpos-app lists `default` explicitly: declaring any `networks:` on
# a service removes it from `default`, and Caddy would stop resolving it. The
# database and object store stay off `default` so the neighbouring services
# cannot reach them.
#
# Fill the secrets with ./render-compose-block.sh — never by hand. It generates
# every credential and writes each one to all the places that must agree.
#
# Requires Docker Engine >= 24 and compose plugin >= v2.20
# (`service_completed_successfully`, `up --wait`).

services:
  mpos-app:
    # Immutable digest pin from the stack dir's .env (rewritten by the deploy job).
    image: ${MPOS_IMAGE}
    restart: unless-stopped
    environment:
      # [DB-PW] MUST equal POSTGRES_PASSWORD in mpos-db.
      DATABASE_URL: postgresql://mpos:CHANGE-ME-DB-PW-hex16@mpos-db:5432/mpos

      MPOS_STORAGE_ENDPOINT: http://mpos-minio:9000
      MPOS_STORAGE_REGION: us-east-1
      # [S3-APP] MUST equal MPOS_INIT_APP_KEY / MPOS_INIT_APP_SECRET in mpos-minio-init.
      MPOS_STORAGE_ACCESS_KEY_ID: CHANGE-ME-app-key-hex8
      MPOS_STORAGE_SECRET_ACCESS_KEY: CHANGE-ME-app-secret-hex32
      MPOS_STORAGE_BUCKET: mpos-sessions

      MPOS_REQUIRE_DURABLE_STORAGE: "true"
      MPOS_COOKIE_SECURE: "true"
      MPOS_COOKIE_SAMESITE: lax
      MPOS_DEMO_ERROR_INJECTION: "false"
      MPOS_ALLOW_DEV_ORIGINS: "false"

      # Hard requirement: /api/requirements/chat and the legacy generator path read
      # ONLY these legacy names (requirements_chat.py / generator.py), as does
      # /api/health's deepseek_configured.
      DEEPSEEK_API_KEY: CHANGE-ME-sk-deepseek
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-v4-flash
    expose:
      - "10000"              # reached by Caddy over the shared network; NOT published
    # `default` keeps Caddy able to resolve `mpos-app`; see the header.
    networks: [default, mpos_internal]
    depends_on:
      mpos-db:
        condition: service_healthy
      mpos-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s      # startup runs restore_all() from MinIO; grows with bucket
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    logging: &mpos-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # A dedicated Postgres, NOT the plugin backend's. Reusing that one would need a
  # manual CREATE DATABASE/CREATE ROLE against a live production DB by the ops
  # owner — postgres init scripts only run on an empty data dir. This container
  # self-bootstraps from POSTGRES_* on an empty volume: zero host round-trips.
  mpos-db:
    image: postgres:16.14@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    restart: unless-stopped
    environment:
      POSTGRES_USER: mpos
      POSTGRES_DB: mpos
      # [DB-PW] MUST equal the password inside DATABASE_URL above.
      POSTGRES_PASSWORD: CHANGE-ME-DB-PW-hex16
    volumes:
      - mpos_pgdata:/var/lib/postgresql/data
    networks: [mpos_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpos -d mpos"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    pids_limit: 256
    logging: *mpos-logging

  mpos-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data
    environment:
      # [S3-ROOT] bootstrap credentials; only mpos-minio-init uses them, the app never does.
      MINIO_ROOT_USER: CHANGE-ME-root-user-hex16
      MINIO_ROOT_PASSWORD: CHANGE-ME-root-pw-hex32
    volumes:
      - mpos_miniodata:/data
    networks: [mpos_internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    pids_limit: 256
    logging: *mpos-logging

  # One-shot convergence: bucket + app credential + least-privilege policy.
  # Idempotent; rerun after rotating the app secret (it re-creates the MinIO user).
  # MinIO cannot read back a stored secret, so convergence is probed by actually
  # authenticating with the target app credentials.
  mpos-minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    environment:
      MINIO_ROOT_USER: CHANGE-ME-root-user-hex16          # = mpos-minio value
      MINIO_ROOT_PASSWORD: CHANGE-ME-root-pw-hex32        # = mpos-minio value
      MPOS_INIT_APP_KEY: CHANGE-ME-app-key-hex8           # = MPOS_STORAGE_ACCESS_KEY_ID
      MPOS_INIT_APP_SECRET: CHANGE-ME-app-secret-hex32    # = MPOS_STORAGE_SECRET_ACCESS_KEY
    networks: [mpos_internal]
    depends_on:
      mpos-minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set root http://mpos-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing root/mpos-sessions
        if mc alias set appprobe http://mpos-minio:9000 "$$MPOS_INIT_APP_KEY" "$$MPOS_INIT_APP_SECRET" >/dev/null 2>&1 \
           && mc ls appprobe/mpos-sessions >/dev/null 2>&1; then
          echo "app credential already converged"
        else
          if mc admin user info root "$$MPOS_INIT_APP_KEY" >/dev/null 2>&1; then
            echo "rotating existing app credential (same key id, new secret)"
            mc admin user remove root "$$MPOS_INIT_APP_KEY"
          fi
          mc admin user add root "$$MPOS_INIT_APP_KEY" "$$MPOS_INIT_APP_SECRET"
        fi
        cat > /tmp/mpos-app-policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:ListBucket", "s3:ListBucketMultipartUploads"],
              "Resource": ["arn:aws:s3:::mpos-sessions"]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:AbortMultipartUpload",
                "s3:ListMultipartUploadParts"
              ],
              "Resource": ["arn:aws:s3:::mpos-sessions/*"]
            }
          ]
        }
        POLICY
        mc admin policy create root mpos-app-rw /tmp/mpos-app-policy.json
        # Reconcile attachments: attach is additive, so detach anything else the
        # user may have accumulated — least privilege must survive reruns.
        current=$$(mc admin user info root "$$MPOS_INIT_APP_KEY" | sed -n 's/^PolicyName[:] *//p' | tr ',' ' ')
        for p in $$current; do
          if [ "$$p" != "mpos-app-rw" ]; then
            echo "detaching unexpected policy: $$p"
            mc admin policy detach root "$$p" --user "$$MPOS_INIT_APP_KEY"
          fi
        done
        case " $$current " in
          *" mpos-app-rw "*) echo "policy already attached" ;;
          *) mc admin policy attach root mpos-app-rw --user "$$MPOS_INIT_APP_KEY" ;;
        esac
        mc alias set appverify http://mpos-minio:9000 "$$MPOS_INIT_APP_KEY" "$$MPOS_INIT_APP_SECRET"
        mc ls appverify/mpos-sessions
        echo "minio-init converged OK"
    logging: *mpos-logging

# The host file has NO `networks:` section — add this one whole.
networks:
  mpos_internal:
    name: mpos_internal

# Paste into the host file's existing `volumes:` map, alongside postgres-data,
# upypi-db, upypi-pkgs, caddy-config and caddy-data.
volumes:
  mpos_pgdata:
    name: mpos_pgdata
  mpos_miniodata:
    name: mpos_miniodata
